<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SADEE SOLUTIONS ADMIN</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
</head>

<body>

<div id="login">

    <div class="login-box">

        <h1>SADEE X DIMA</h1>
        <h2>ADMIN PANEL</h2>

        <input
            id="email"
            type="email"
            placeholder="Admin Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            LOGIN
        </button>

        <p id="loginMsg"></p>

    </div>

</div>


<div id="app" class="hidden">

    <header>

        <h1>SADEE SOLUTIONS ADMIN</h1>

        <button id="logout">
            LOGOUT
        </button>

    </header>


    <main>

        <div class="stats">

            <div>
                <b id="count">0</b>
                <span>Products</span>
            </div>

            <div>
                <b id="activeCount">0</b>
                <span>Active</span>
            </div>

            <div>
                <b id="orderCount">0</b>
                <span>Orders</span>
            </div>

        </div>


        <div class="toolbar">

            <input
                id="adminSearch"
                placeholder="Search products..."
            >

            <button id="newBtn">
                + ADD PRODUCT
            </button>

        </div>


        <section>

            <h2>PRODUCTS</h2>

            <div id="table"></div>

        </section>


        <section>

            <h2>ORDERS</h2>

            <div id="orders"></div>

        </section>

    </main>

</div>


<div id="modal">

    <div class="modal-box">

        <h2 id="formTitle">
            Add Product
        </h2>

        <input id="pid" type="hidden">

        <input
            id="pname"
            placeholder="Product Name"
        >

        <input
            id="pcat"
            placeholder="Category"
        >

        <input
            id="pprice"
            type="number"
            placeholder="Price"
        >

        <input
            id="pnote"
            placeholder="Price Note"
        >

        <textarea
            id="pdesc"
            placeholder="Description"
        ></textarea>

        <textarea
            id="pfeatures"
            placeholder="Features - one per line"
        ></textarea>

        <input
            id="pimageurl"
            placeholder="Image URL"
        >

        <input
            id="pimage"
            type="file"
            accept="image/*"
        >

        <label>
            <input
                id="pfeatured"
                type="checkbox"
            >
            Featured
        </label>

        <label>
            <input
                id="pactive"
                type="checkbox"
                checked
            >
            Active
        </label>

        <p id="saveMsg"></p>

        <button id="save">
            SAVE PRODUCT
        </button>

        <button id="close">
            CANCEL
        </button>

    </div>

</div>


<script src="admin.js"></script>

</body>
</html>
