name: Firebase Hosting Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Find website
        run: |
          echo "Searching for index.html..."
          find . -type f -name "index.html" \
            -not -path "./.git/*" \
            -not -path "./firebase-public/*"

      - name: Prepare Firebase website
        run: |
          rm -rf firebase-public
          mkdir firebase-public

          INDEX=$(find . -type f -name "index.html" \
            -not -path "./.git/*" \
            -not -path "./firebase-public/*" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not found!"
            exit 1
          fi

          echo "Using: $INDEX"

          SITE_DIR=$(dirname "$INDEX")

          cp -R "$SITE_DIR"/. firebase-public/

          echo "Firebase files:"
          find firebase-public -maxdepth 2 -type f

      - name: Create Firebase config
        run: |
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": "firebase-public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "cleanUrls": true,
              "trailingSlash": false
            }
          }
          EOF

      - name: Verify website
        run: |
          test -f firebase-public/index.html
          echo "index.html FOUND ✅"

      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          firebase deploy \
            --only hosting \
            --project sadeexdima
