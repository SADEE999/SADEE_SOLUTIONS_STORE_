name: SADEE SOLUTIONS - Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-solutions-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Website & Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Get repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find uploaded ZIP
      - name: Find Website ZIP
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found"
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          cp "$ZIP_FILE" website.zip

      # 3. Test ZIP
      - name: Test ZIP
        shell: bash
        run: |
          set -e

          echo "===== TESTING ZIP ====="

          unzip -t website.zip

          echo "✅ ZIP is valid"

      # 4. Extract ZIP
      - name: Extract Website
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o website.zip -d extracted

          echo "✅ ZIP extracted"

      # 5. Find original website root
      - name: Detect Website Root
        shell: bash
        run: |
          set -e

          echo "===== SEARCHING index.html ====="

          INDEX_FILE=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "❌ index.html not found"

            echo "===== EXTRACTED FILES ====="
            find extracted -maxdepth 8 -type f | sort

            exit 1
          fi

          echo "✅ index.html:"
          echo "$INDEX_FILE"

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo "===== WEBSITE ROOT ====="
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          # Copy original website WITHOUT redesigning it
          cp -a "$WEBSITE_ROOT"/. dist/

          echo "✅ Original website copied"

      # 6. Verify everything
      - name: Verify Website
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================"
          echo "       WEBSITE CHECK"
          echo "================================"

          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html missing"
            exit 1
          fi

          echo "✅ index.html"

          if [ -f "dist/styles.css" ]; then
            echo "✅ styles.css"
          fi

          if [ -f "dist/app.js" ]; then
            echo "✅ app.js"
          fi

          if [ -f "dist/config.js" ]; then
            echo "✅ config.js"
          fi

          if [ -d "dist/admin" ]; then
            echo "✅ admin folder"

            if [ -f "dist/admin/index.html" ]; then
              echo "✅ admin/index.html"
            fi
          else
            echo "⚠️ admin folder not found"
          fi

          if [ -d "dist/assets" ]; then
            echo "✅ assets folder"
          fi

          echo ""
          echo "===== MEDIA FILES ====="

          find dist \
            -type f \
            \( \
              -iname "*.mp4" \
              -o -iname "*.webm" \
              -o -iname "*.mov" \
              -o -iname "*.m4v" \
              -o -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
            \) \
            | sort || true

          echo ""
          echo "================================"
          echo "       BUILD SUCCESS"
          echo "================================"

      # 7. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 8. Upload website
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 9. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 10. Show URLs
      - name: Show Website URLs
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SADEE SOLUTIONS DEPLOYED"
          echo "=============================================="
          echo ""
          echo "Customer Website:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE/"
          echo ""
          echo "Admin Panel:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE/admin/"
          echo ""
          echo "=============================================="
