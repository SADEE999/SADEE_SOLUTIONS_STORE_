name: SADEE SOLUTIONS - Restore & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-solutions-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Restore Website & Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================
      # 1. GET FULL GIT HISTORY
      # ==========================================
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. FIND OLD WEBSITE ZIP FROM GIT HISTORY
      # ==========================================
      - name: Find Website ZIP In Git History
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SEARCHING GIT HISTORY FOR WEBSITE ZIP"
          echo "=========================================="

          ZIP_PATH=$(git log --all \
            --name-only \
            --pretty=format: \
            --diff-filter=A \
            -- '*.zip' \
            | sed '/^$/d' \
            | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "❌ No ZIP found in Git history."
            echo ""
            echo "ZIP files currently known:"
            git log --all --name-only --pretty=format: -- '*.zip' \
              | sed '/^$/d' \
              | sort -u || true
            exit 1
          fi

          echo "✅ ZIP path found:"
          echo "$ZIP_PATH"

          echo "ZIP introduction commit:"
          ZIP_COMMIT=$(git log --all \
            --format='%H' \
            --diff-filter=A \
            -- "$ZIP_PATH" \
            | head -n 1)

          if [ -z "$ZIP_COMMIT" ]; then
            echo "❌ Could not find ZIP commit."
            exit 1
          fi

          echo "$ZIP_COMMIT"

          git show "$ZIP_COMMIT:$ZIP_PATH" > website.zip

          echo ""
          echo "Recovered ZIP:"
          ls -lh website.zip

      # ==========================================
      # 3. TEST ZIP
      # ==========================================
      - name: Validate Website ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP..."

          unzip -t website.zip

          echo "✅ ZIP is valid."

      # ==========================================
      # 4. EXTRACT WEBSITE
      # ==========================================
      - name: Extract Website
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o website.zip -d extracted

          echo "✅ Website extracted."

      # ==========================================
      # 5. FIND INDEX.HTML
      # ==========================================
      - name: Detect Website Root
        shell: bash
        run: |
          set -e

          echo "Searching for index.html..."

          INDEX_FILE=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "❌ index.html not found."

            echo ""
            echo "Extracted files:"
            find extracted -type f | sort

            exit 1
          fi

          echo "✅ index.html found:"
          echo "$INDEX_FILE"

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo ""
          echo "Website root:"
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          cp -a "$WEBSITE_ROOT"/. dist/

          echo ""
          echo "✅ Website copied to dist."

      # ==========================================
      # 6. VERIFY WEBSITE
      # ==========================================
      - name: Verify Website
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " WEBSITE CHECK"
          echo "=========================================="

          test -f dist/index.html

          echo "✅ index.html"

          if [ -f dist/styles.css ]; then
            echo "✅ styles.css"
          fi

          if [ -f dist/app.js ]; then
            echo "✅ app.js"
          fi

          if [ -f dist/config.js ]; then
            echo "✅ config.js"
          fi

          if [ -d dist/admin ]; then
            echo "✅ admin folder"
          fi

          if [ -f dist/admin/index.html ]; then
            echo "✅ admin/index.html"
          fi

          echo ""
          echo "Website files:"
          find dist -maxdepth 3 -type f | sort

      # ==========================================
      # 7. CONFIGURE GITHUB PAGES
      # ==========================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 8. UPLOAD WEBSITE
      # ==========================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # ==========================================
      # 9. DEPLOY
      # ==========================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================
      # 10. FINAL STATUS
      # ==========================================
      - name: Deployment Complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SADEE SOLUTIONS WEBSITE LIVE"
          echo "=========================================="
          echo ""
          echo "Customer Website:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE_/"
          echo ""
          echo "Admin Panel:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE_/admin/"
          echo ""
          echo "=========================================="
