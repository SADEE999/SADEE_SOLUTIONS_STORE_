name: SADEE SOLUTIONS - ZIP DEPLOY

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find ZIP File
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "ZIP extracted successfully"

      - name: Find Website
        shell: bash
        run: |
          INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

          echo "Index file:"
          echo "$INDEX_FILE"

          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found inside ZIP"
            exit 1
          fi

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo "Website root:"
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          cp -a "$WEBSITE_ROOT"/. dist/

      - name: Show Final Files
        shell: bash
        run: |
          echo "===== FINAL WEBSITE ====="
          find dist -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
