name: SADEE SOLUTIONS - ZIP DEPLOY

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-solutions-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Rebuild ZIP and Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================
      # REBUILD ORIGINAL ZIP
      # =========================

      - name: Rebuild ZIP From Parts
        shell: bash
        run: |
          set -e

          echo "===== ZIP PARTS ====="

          ls -lh *.part* || true

          if [ ! -f "SADEE_SOLUTIONS_STORE_KEEP_OLD_DESIGN.zip.part01" ]; then
            echo "❌ Part 01 missing"
            exit 1
          fi

          if [ ! -f "SADEE_SOLUTIONS_STORE_KEEP_OLD_DESIGN.zip.part02" ]; then
            echo "❌ Part 02 missing"
            exit 1
          fi

          echo "Joining ZIP parts..."

          cat \
          SADEE_SOLUTIONS_STORE_KEEP_OLD_DESIGN.zip.part01 \
          SADEE_SOLUTIONS_STORE_KEEP_OLD_DESIGN.zip.part02 \
          > website.zip

          echo "✅ ZIP rebuilt"

          ls -lh website.zip


      # =========================
      # TEST ZIP
      # =========================

      - name: Test ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP..."

          unzip -t website.zip

          echo "✅ ZIP is valid"


      # =========================
      # EXTRACT
      # =========================

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o website.zip -d extracted

          echo "✅ ZIP extracted"


      # =========================
      # FIND ORIGINAL WEBSITE
      # =========================

      - name: Find Website Root
        shell: bash
        run: |
          set -e

          echo "Searching for index.html..."

          INDEX_FILE=$(find extracted \
            -type f \
            -name "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then

            echo "❌ index.html not found"

            echo "===== EXTRACTED FILES ====="

            find extracted \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          echo "✅ index.html found:"
          echo "$INDEX_FILE"

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo "Website root:"
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          # COPY ORIGINAL WEBSITE EXACTLY
          cp -a "$WEBSITE_ROOT"/. dist/


      # =========================
      # VERIFY ORIGINAL DESIGN
      # =========================

      - name: Verify Website
        shell: bash
        run: |
          set -e

          echo ""
          echo "===== FINAL WEBSITE ====="

          find dist \
            -maxdepth 6 \
            -type f \
            | sort

          echo ""

          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html missing"
            exit 1
          fi

          echo "✅ Main website found"


          if [ -d "dist/admin" ]; then
            echo "✅ Admin folder found"
          else
            echo "⚠️ Admin folder not found"
          fi


          if [ -d "dist/assets" ]; then
            echo "✅ Assets folder found"
          fi


          VIDEO_FOUND=false

          while IFS= read -r file
          do
            echo "🎥 Video: $file"
            VIDEO_FOUND=true
          done < <(
            find dist \
              -type f \
              \( \
                -iname "*.mp4" \
                -o -iname "*.webm" \
                -o -iname "*.mov" \
                -o -iname "*.m4v" \
              \)
          )


          if [ "$VIDEO_FOUND" = true ]; then
            echo "✅ Video files found"
          else
            echo "ℹ️ No video file detected"
          fi


          echo ""
          echo "================================"
          echo "✅ ORIGINAL WEBSITE READY"
          echo "================================"


      # =========================
      # GITHUB PAGES
      # =========================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =========================
      # UPLOAD
      # =========================

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


      # =========================
      # DEPLOY
      # =========================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
