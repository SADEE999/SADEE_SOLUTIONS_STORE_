name: SADEE SOLUTIONS - Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean Pages folder
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp index.html app.js styles.css config.js dist/
          cp -r assets dist/assets
          cp -r admin dist/admin

          echo "Pages root:"
          find dist -maxdepth 2 -type f | sort

          test -f dist/index.html
          test -f dist/admin/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
