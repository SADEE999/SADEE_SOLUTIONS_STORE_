name: SADEE SOLUTIONS - RESTORE ORIGINAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sadee-solutions-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Restore Original Website
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==============================
      # CHECKOUT FULL HISTORY
      # ==============================

      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==============================
      # RESTORE ORIGINAL ZIP
      # ==============================

      - name: Restore Original Website ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " RESTORING ORIGINAL WEBSITE"
          echo "======================================"

          ZIP_PATH="SADEE_SOLUTIONS_PRO_MAX_FINAL.zip"
          ZIP_COMMIT="038c4b4"

          echo "ZIP:"
          echo "$ZIP_PATH"

          echo "COMMIT:"
          echo "$ZIP_COMMIT"

          git show "$ZIP_COMMIT:$ZIP_PATH" > website.zip

          echo ""
          echo "Recovered ZIP:"
          ls -lh website.zip

          test -s website.zip

          echo "✅ ORIGINAL ZIP RESTORED"


      # ==============================
      # TEST ZIP
      # ==============================

      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP..."

          unzip -t website.zip

          echo "✅ ZIP VALID"


      # ==============================
      # EXTRACT
      # ==============================

      - name: Extract Original Website
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o website.zip -d extracted

          echo "✅ Website extracted"


      # ==============================
      # FIND INDEX
      # ==============================

      - name: Find Website Root
        shell: bash
        run: |
          set -e

          echo "Searching for index.html..."

          INDEX_FILE=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "❌ index.html NOT FOUND"
            echo ""
            echo "Extracted files:"
            find extracted -type f | sort
            exit 1
          fi

          echo "✅ index.html found:"
          echo "$INDEX_FILE"

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo "Website root:"
          echo "$WEBSITE_ROOT"

          rm -rf dist
          mkdir -p dist

          cp -a "$WEBSITE_ROOT"/. dist/

          echo "✅ Website copied to dist"


      # ==============================
      # CHECK WEBSITE
      # ==============================

      - name: Verify Website
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " WEBSITE CHECK"
          echo "======================================"

          test -f dist/index.html

          echo "✅ index.html"

          if [ -f dist/styles.css ]; then
            echo "✅ styles.css"
          fi

          if [ -f dist/app.js ]; then
            echo "✅ app.js"
          fi

          if [ -f dist/config.js ]; then
            echo "✅ config.js"
          fi


      # ==============================
      # CHECK ADMIN
      # ==============================

      - name: Verify Admin Panel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " ADMIN PANEL CHECK"
          echo "======================================"

          if [ ! -d "dist/admin" ]; then
            echo "❌ admin folder missing"
            echo ""
            echo "Folders found:"
            find dist -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "✅ admin folder"

          if [ ! -f "dist/admin/index.html" ]; then
            echo "❌ admin/index.html missing"
            exit 1
          fi

          echo "✅ admin/index.html"

          if [ -f "dist/admin/admin.js" ]; then
            echo "✅ admin/admin.js"
          fi

          if [ -f "dist/admin/admin.css" ]; then
            echo "✅ admin/admin.css"
          fi


      # ==============================
      # SHOW FILES
      # ==============================

      - name: Show Website Files
        shell: bash
        run: |
          echo "======================================"
          echo " WEBSITE FILES"
          echo "======================================"

          find dist -maxdepth 5 -type f | sort


      # ==============================
      # GITHUB PAGES
      # ==============================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ==============================
      # DONE
      # ==============================

      - name: Deployment Complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " SADEE SOLUTIONS RESTORED"
          echo "=============================================="

          echo ""
          echo "CUSTOMER WEBSITE:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE_/"

          echo ""
          echo "ADMIN PANEL:"
          echo "https://sadee999.github.io/SADEE_SOLUTIONS_STORE_/admin/"

          echo ""
          echo "=============================================="
